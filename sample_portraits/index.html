
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Faction Avatar Previews</title>
        <style>
            body { background: #1a1a1a; color: #e0d8c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; }
            .faction-row { margin-bottom: 40px; }
            .faction-title { border-bottom: 2px solid #554a3f; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
            .avatar-container { display: flex; gap: 20px; }
            .avatar { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
            /* Mocking some of the faction borders from our game */
            .border-human { border: 3px solid #3498db; }
            .border-elf { border: 3px solid #4CAF50; }
            .border-orc { border: 3px solid #e74c3c; }
            .border-dwarf { border: 3px solid #c2b083; }
            .border-goblin { border: 3px solid #9b59b6; }
            .border-nightelf { border: 3px solid #1abc9c; }
        </style>
    </head>
    <body>
        <h1>DiceBear Faction Avatar Previews</h1>
        <p>Testing styles for each of the 6 factions.</p>
  <div class="faction-row">
               <h2 class="faction-title">human (adventurer)</h2>
               <div class="avatar-container">
<img class="avatar border-human" src="human_1.svg" alt="human 1" /><img class="avatar border-human" src="human_2.svg" alt="human 2" /><img class="avatar border-human" src="human_3.svg" alt="human 3" /><img class="avatar border-human" src="human_4.svg" alt="human 4" /><img class="avatar border-human" src="human_5.svg" alt="human 5" />  </div>
             </div><div class="faction-row">
               <h2 class="faction-title">elf (lorelei)</h2>
               <div class="avatar-container">
<img class="avatar border-elf" src="elf_1.svg" alt="elf 1" /><img class="avatar border-elf" src="elf_2.svg" alt="elf 2" /><img class="avatar border-elf" src="elf_3.svg" alt="elf 3" /><img class="avatar border-elf" src="elf_4.svg" alt="elf 4" /><img class="avatar border-elf" src="elf_5.svg" alt="elf 5" />  </div>
             </div><div class="faction-row">
               <h2 class="faction-title">orc (personas)</h2>
               <div class="avatar-container">
<img class="avatar border-orc" src="orc_1.svg" alt="orc 1" /><img class="avatar border-orc" src="orc_2.svg" alt="orc 2" /><img class="avatar border-orc" src="orc_3.svg" alt="orc 3" /><img class="avatar border-orc" src="orc_4.svg" alt="orc 4" /><img class="avatar border-orc" src="orc_5.svg" alt="orc 5" />  </div>
             </div><div class="faction-row">
               <h2 class="faction-title">dwarf (micah)</h2>
               <div class="avatar-container">
<img class="avatar border-dwarf" src="dwarf_1.svg" alt="dwarf 1" /><img class="avatar border-dwarf" src="dwarf_2.svg" alt="dwarf 2" /><img class="avatar border-dwarf" src="dwarf_3.svg" alt="dwarf 3" /><img class="avatar border-dwarf" src="dwarf_4.svg" alt="dwarf 4" /><img class="avatar border-dwarf" src="dwarf_5.svg" alt="dwarf 5" />  </div>
             </div><div class="faction-row">
               <h2 class="faction-title">goblin (thumbs)</h2>
               <div class="avatar-container">
<img class="avatar border-goblin" src="goblin_1.svg" alt="goblin 1" /><img class="avatar border-goblin" src="goblin_2.svg" alt="goblin 2" /><img class="avatar border-goblin" src="goblin_3.svg" alt="goblin 3" /><img class="avatar border-goblin" src="goblin_4.svg" alt="goblin 4" /><img class="avatar border-goblin" src="goblin_5.svg" alt="goblin 5" />  </div>
             </div><div class="faction-row">
               <h2 class="faction-title">nightelf (avataaars)</h2>
               <div class="avatar-container">
<img class="avatar border-nightelf" src="nightelf_1.svg" alt="nightelf 1" /><img class="avatar border-nightelf" src="nightelf_2.svg" alt="nightelf 2" /><img class="avatar border-nightelf" src="nightelf_3.svg" alt="nightelf 3" /><img class="avatar border-nightelf" src="nightelf_4.svg" alt="nightelf 4" /><img class="avatar border-nightelf" src="nightelf_5.svg" alt="nightelf 5" />  </div>
